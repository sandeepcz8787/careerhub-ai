<!DOCTYPE html>
<html lang="en" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>CareerHub AI — AI-Powered Career Platform</title>
    <meta name="title" content="CareerHub AI — AI-Powered Career Platform" />
    <meta
      name="description"
      content="Land your dream job with CareerHub AI. Build ATS-optimized resumes, get AI career coaching, track applications, practice mock interviews, and connect with top recruiters."
    />
    <meta name="keywords" content="resume builder, job tracker, AI career, mock interview, ATS checker, career platform" />
    <meta name="author" content="CareerHub AI" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#6366f1" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://careerhub.ai/" />
    <meta property="og:title" content="CareerHub AI — AI-Powered Career Platform" />
    <meta
      property="og:description"
      content="Land your dream job with CareerHub AI. Build ATS-optimized resumes, get AI career coaching, track applications, practice mock interviews."
    />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://careerhub.ai/" />
    <meta property="twitter:title" content="CareerHub AI — AI-Powered Career Platform" />
    <meta property="twitter:description" content="Land your dream job with AI-powered career tools." />
    <meta property="twitter:image" content="/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Fonts — Inter + Outfit from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "CareerHub AI",
        "description": "AI-Powered Career Platform",
        "url": "https://careerhub.ai",
        "applicationCategory": "BusinessApplication",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
